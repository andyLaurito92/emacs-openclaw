name: Emacs lint and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  emacs-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '29.1'

      - name: Install Dependencies
        run: |
          emacs -Q --batch --eval "(progn
            (require 'package)
            (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)
            (add-to-list 'package-archives '(\"gnu\" . \"https://elpa.gnu.org/packages/\") t)
            (package-initialize)
            (package-refresh-contents)
            (package-install 'request)
            (package-install 'websocket)
            (package-install 'deferred))"

      - name: Elisp Syntax Checker
        run: |
          emacs -Q --batch -L . --eval "(package-initialize)" emacs-openclaw.el --eval '(check-parens)'

      - name: Byte-compile
        run: |
          emacs -Q --batch -L . --eval "(package-initialize)" -f batch-byte-compile emacs-openclaw.el

      - name: Docstring Linter
        run: |
          emacs -Q --batch -L . --eval "(package-initialize)" emacs-openclaw.el --eval '(checkdoc-file "emacs-openclaw.el")'

      - name: Run ERT Tests
        # Note: This will only pass if you have created tests/test-openclaw.el
        # If you haven't created it yet, you might want to comment this step out!
        run: |
          emacs -Q --batch -L . --eval "(package-initialize)" -l tests/test-openclaw.el -f ert-run-tests-batch-and-exit
