name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Check Python syntax
      run: |
        python -m py_compile server/server.py server/tools.py
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
      continue-on-error: true
    
    - name: Format check with black
      run: black --check server/
      continue-on-error: true
    
    - name: Lint with flake8
      run: |
        flake8 server/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 server/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

